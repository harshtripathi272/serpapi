[project]
name = "firstseen"
version = "0.1.0"
description = "Find when and where an image first appeared online, using SerpApi's Google Lens API."
requires-python = ">=3.11"
dependencies = [
    "serpapi>=1.1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "pillow>=10",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firstseen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
